version: "3.9"

services:
  nginx:
    container_name: infisical-dev-nginx
    image: nginx
    restart: "always"
    ports:
      - ${NGINX_PORT:-8080}:80
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

  db:
    image: postgres:14-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: infisical
      POSTGRES_USER: infisical
      POSTGRES_DB: infisical

  redis:
    image: redis
    container_name: infisical-dev-redis
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:25.12.5
    container_name: infisical-dev-clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    environment:
      - CLICKHOUSE_DB=infisical
      - CLICKHOUSE_USER=infisical
      - CLICKHOUSE_PASSWORD=infisical
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  redis-commander:
    container_name: infisical-dev-redis-commander
    image: rediscommander/redis-commander
    restart: always
    depends_on:
      - redis
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-8085}:8081"

  bull-board:
    container_name: infisical-dev-bull-board
    image: venatum/bull-board:3.3.7
    restart: always
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BULL_VERSION=BULLMQ
      - BULL_PREFIX=bull
    ports:
      - "${BULL_BOARD_PORT:-3008}:3000"
    profiles: [queue]

  db-test:
    profiles: ["test"]
    image: postgres:14-alpine
    ports:
      - "${DB_TEST_PORT:-5430}:5432"
    environment:
      POSTGRES_PASSWORD: infisical
      POSTGRES_USER: infisical
      POSTGRES_DB: infisical-test
    command: postgres -c max_locks_per_transaction=512

  backend:
    container_name: infisical-dev-api
    build:
      context: ./backend
      dockerfile: Dockerfile.dev.fips
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      clickhouse:
        condition: service_started
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-4000}:4000"
      - "${OTEL_PORT:-9464}:9464"
      - "${BACKEND_DEBUG_PORT:-9229}:9229"
    environment:
      - NODE_ENV=development
      - DB_CONNECTION_URI=postgres://infisical:infisical@db/infisical?sslmode=disable
      - TELEMETRY_ENABLED=false
    volumes:
      - ./backend/src:/app/src:cached
      - ./backend/nodemon.json:/app/nodemon.json:cached
      - ./backend/tsconfig.dev.json:/app/tsconfig.dev.json:cached
      - softhsm_tokens:/etc/softhsm2/tokens
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "pf.local:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.dev.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    profiles: [metrics]

  otel-collector:
    image: otel/opentelemetry-collector-contrib
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "${OTEL_PPROF_PORT:-1888}:1888"
      - "${OTEL_METRICS_PORT:-8888}:8888"
      - "${OTEL_EXPORTER_PORT:-8889}:8889"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_ZPAGES_PORT:-55679}:55679"
    profiles: [metrics-otel]

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_LOG_LEVEL=debug
    ports:
      - "${GRAFANA_PORT:-3005}:3000"
    volumes:
      - "grafana_storage:/var/lib/grafana"
    profiles: [metrics]

  frontend:
    container_name: infisical-dev-frontend
    restart: unless-stopped
    depends_on:
      - backend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/app/src:cached
      - ./frontend/public:/app/public:cached
      - ./frontend/index.html:/app/index.html:cached
      - ./frontend/vite.config.ts:/app/vite.config.ts:cached
      - ./frontend/tsconfig.json:/app/tsconfig.json:cached
      - frontend-node-modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_ALLOWED_HOSTS=*
    env_file: .env

  backend-go:
    container_name: infisical-dev-api-go
    build:
      context: ./backend-go
      dockerfile: Dockerfile.dev.fips
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "${BACKEND_GO_PORT:-4040}:4040"
    volumes:
      - ./backend-go:/app:cached
    environment:
      - DB_CONNECTION_URI=postgres://infisical:infisical@db/infisical?sslmode=disable
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    profiles: [go]

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: pass
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db

  smtp-server:
    container_name: infisical-dev-smtp-server
    image: lytrax/mailhog:latest
    restart: always
    logging:
      driver: "none"
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${SMTP_WEB_PORT:-8025}:8025"

  openldap:
    image: osixia/openldap:1.5.0
    restart: always
    environment:
      LDAP_ORGANISATION: Acme
      LDAP_DOMAIN: acme.com
      LDAP_ADMIN_PASSWORD: admin
    ports:
      - "${LDAP_PORT:-389}:389"
      - "${LDAPS_PORT:-636}:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    profiles: [ldap]

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    restart: always
    environment:
      - PHPLDAPADMIN_LDAP_HOSTS=openldap
      - PHPLDAPADMIN_HTTPS=false
    ports:
      - "${PHPLDAPADMIN_PORT:-6433}:80"
    depends_on:
      - openldap
    profiles: [ldap]

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    restart: always
    environment:
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
    command: start-dev
    ports:
      - "${KEYCLOAK_PORT:-8088}:8080"
    profiles: [sso]

  pingfederate:
    image: pingidentity/pingfederate:2604
    restart: always
    environment:
      - PING_IDENTITY_ACCEPT_EULA=YES
      - PING_IDENTITY_DEVOPS_USER=${PING_IDENTITY_DEVOPS_USER}
      - PING_IDENTITY_DEVOPS_KEY=${PING_IDENTITY_DEVOPS_KEY}
      - SERVER_PROFILE_URL=https://github.com/pingidentity/pingidentity-server-profiles.git
      - SERVER_PROFILE_PATH=getting-started/pingfederate
      - PF_PROVISIONER_MODE=STANDALONE
    ports:
      - "${PINGFEDERATE_ADMIN_PORT:-9999}:9999"
      - "${PINGFEDERATE_RUNTIME_PORT:-9031}:9031"
    volumes:
      - pingfederate_data:/opt/out
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: [pingfed]

  samba-ad:
    image: nowsci/samba-domain:latest
    container_name: infisical-dev-samba-ad
    hostname: dc1
    cap_add:
      - SYS_ADMIN
    privileged: true
    environment:
      - DOMAIN=ACME.LOCAL
      - DOMAIN_DC=dc=acme,dc=local
      - DOMAINPASS=${SAMBA_ADMIN_PASSWORD:-Passw0rd!}
      - DNSFORWARDER=8.8.8.8
      - HOSTIP=0.0.0.0
      - INSECURELDAP=true
    ports:
      - "${SAMBA_LDAP_PORT:-1389}:389"
      - "${SAMBA_LDAPS_PORT:-1636}:636"
      - "${SAMBA_KERBEROS_PORT:-88}:88"
      - "${SAMBA_KERBEROS_UDP_PORT:-88}:88/udp"
    volumes:
      - samba_data:/var/lib/samba
      - samba_etc:/etc/samba/external
    profiles: [ad]

volumes:
  postgres-data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
  ldap_data:
  ldap_config:
  pingfederate_data:
  samba_data:
  samba_etc:
  grafana_storage:
  softhsm_tokens:
    driver: local
  frontend-node-modules: